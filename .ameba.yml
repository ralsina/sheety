# examples/ holds generated spreadsheets (e.g. the ~20k-line
# test_chained_100x100.cr emitted by sheety itself); linting generated
# code only produces noise. Run ameba as `ameba src spec` to keep it fast.
ExcludedPaths:
  - examples
  - lib
  - bin

Metrics/CyclomaticComplexity:
  # The parser's filter chain, the code generator's function dispatch,
  # the Excel function implementations and the TUI key handlers are
  # inherently branchy; refactoring them for the metric's sake isn't
  # worth the regression risk while they lack dedicated specs.
  Enabled: false

Style/MultilineStringLiteral:
  # croupier_generator builds the generated programs' Crystal source as
  # multiline string templates. Converting them to heredocs is pure churn
  # with a real corruption risk (an automated conversion once mangled the
  # generated code); the templates read fine as they are.
  Enabled: false

Style/PercentLiteralDelimiters:
  # Same generated-source templates; see MultilineStringLiteral above.
  Enabled: false

Documentation/DocumentationAdmonition:
  # TODO comments are allowed
  Enabled: false
